<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCF7F0">
<title>Casa Amara Tienda</title>
<meta name="description" content="Casa Amara — flores, gift boxes y desayunos personalizados con entrega en Lima.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Poppins:wght@300;400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --beige:#F5E8D5; --beige-lt:#F3E9E0; --paper:#FCF7F0; --line:#E6D6BF; --taupe:#CEC7BE;
  --carmin:#C13D49; --carmin-dk:#84202C; --rosa:#CB6677;
  --celeste:#94B6CF; --celeste-lt:#C3DBE7; --azul:#567F99;
  --ink:#3B2527; --ink-2:#6E5557; --ink-3:#9A8583;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:28px;
  --shadow:0 18px 50px -24px rgba(90,30,36,.35);
  --ease:cubic-bezier(.2,.7,.2,1);
  --g:clamp(16px,4vw,40px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--carmin);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:var(--g)}
.eyebrow{font:500 11.5px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--azul)}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-.01em;text-wrap:balance;margin:0}
.price{font-variant-numeric:tabular-nums}

/* ── Header ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--beige) 92%,transparent);backdrop-filter:saturate(1.2) blur(10px)}
.top .bar{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .iso{width:30px;height:auto;transition:transform .5s var(--ease)}
.brand:hover .iso{transform:rotate(-8deg) scale(1.06)}
.brand .word{height:22px;width:auto}
.cartbtn{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--carmin);background:transparent;color:var(--carmin);border-radius:999px;padding:8px 16px;font-weight:500;font-size:13.5px;transition:background .2s,color .2s,transform .2s var(--ease)}
.cartbtn:hover{background:var(--carmin);color:#fff;transform:translateY(-1px)}
.cartbtn .n{min-width:20px;height:20px;border-radius:999px;background:var(--carmin);color:#fff;font-size:11.5px;display:grid;place-items:center;padding:0 6px;transition:background .2s,color .2s}
.cartbtn:hover .n{background:#fff;color:var(--carmin)}
.cartbtn.bump{animation:bump .5s var(--ease)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
.tabs{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper)}
.tabs .wrap{display:flex;align-items:center;gap:14px;height:52px}
.tabrow{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;text-decoration:none;font-size:13.5px;color:var(--ink-2);padding:8px 12px;white-space:nowrap;transition:color .2s}
.tab::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:1.5px;background:var(--carmin);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.tab:hover{color:var(--carmin)}
.tab:hover::after,.tab.on::after{transform:scaleX(1)}
.tab.on{color:var(--carmin-dk);font-weight:500}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;width:220px;flex:none;transition:border-color .2s,box-shadow .2s,width .35s var(--ease)}
.search:focus-within{border-color:var(--celeste);box-shadow:0 0 0 3px color-mix(in srgb,var(--celeste) 30%,transparent);width:260px}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:13.5px;min-width:0}
@media (max-width:720px){.tabs .wrap{flex-direction:column-reverse;align-items:stretch;height:auto;gap:4px;padding-block:8px 2px}.search,.search:focus-within{width:100%}.brand .word{height:18px}}

/* ── View transitions ── */
#view{min-height:60vh}
.enter{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.reveal{transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.pre{opacity:.001;transform:translateY(22px)}

/* ── Banner carousel ── */
.hero{padding-top:clamp(16px,2.5vw,28px)}
.carousel{position:relative;border-radius:var(--r-lg);overflow:hidden;height:clamp(420px,42vw,470px);background:var(--carmin-dk)}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.05fr;align-items:center;gap:24px;padding:clamp(28px,4.5vw,64px);opacity:0;visibility:hidden;transition:opacity .9s var(--ease),visibility .9s}
.slide.on{opacity:1;visibility:visible}
.slide .txt{position:relative;z-index:2;max-width:460px}
.slide .kick{font:500 11.5px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.slide h2{font-size:clamp(32px,4.4vw,56px);line-height:1.02;margin-top:14px}
.slide h2 em{font-style:italic}
.slide p{margin:14px 0 24px;font-size:15px;max-width:38ch;opacity:.9}
.slide .txt>*{transform:translateY(14px);opacity:0;transition:transform .8s var(--ease),opacity .8s var(--ease)}
.slide.on .txt>*{transform:none;opacity:1}
.slide.on .txt>*:nth-child(2){transition-delay:.08s}.slide.on .txt>*:nth-child(3){transition-delay:.16s}.slide.on .txt>*:nth-child(4){transition-delay:.24s}
.s-carmin{background:radial-gradient(120% 90% at 85% 20%,#CB6677 0%,var(--carmin) 45%,var(--carmin-dk) 100%);color:var(--beige)}
.s-celeste{background:radial-gradient(120% 90% at 85% 15%,#DCE9F1 0%,var(--celeste-lt) 40%,var(--celeste) 100%);color:#2a3f50}
.s-celeste h2{color:var(--carmin-dk)}
.s-beige{background:radial-gradient(120% 90% at 80% 20%,#FBF3E8 0%,var(--beige) 50%,#EBD8BD 100%);color:var(--ink)}
.s-beige h2{color:var(--carmin-dk)}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;font-weight:500;font-size:14.5px;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s,background .2s,color .2s}
.btn svg{transition:transform .3s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn:hover svg{transform:translateX(4px)}
.btn.light{background:var(--beige);color:var(--carmin-dk);box-shadow:0 12px 28px -14px rgba(0,0,0,.5)}
.btn.red{background:var(--carmin);color:#fff;box-shadow:0 12px 26px -14px rgba(193,61,73,.8)}
.btn.red:hover{background:var(--carmin-dk)}
.btn.line{background:transparent;color:inherit;border:1px solid currentColor;opacity:.9}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.collage{position:relative;height:100%;min-height:0}
.collage .f{position:absolute;border-radius:999px 999px 18px 18px;overflow:hidden;background:var(--paper);box-shadow:0 26px 50px -24px rgba(40,10,15,.55);border:5px solid rgba(255,255,255,.85)}
.collage .f img{width:100%;height:100%;object-fit:cover}
.collage .f1{width:48%;height:92%;left:26%;top:4%;z-index:2}
.collage .f2{width:34%;height:62%;left:0;top:26%;transform:rotate(-5deg)}
.collage .f3{width:34%;height:62%;right:0;top:14%;transform:rotate(5deg)}
.slide.on .collage .f1{animation:kb 7s ease-out both}
.slide.on .collage .f2{animation:fl2 1.1s var(--ease) both}
.slide.on .collage .f3{animation:fl3 1.1s var(--ease) .1s both}
@keyframes kb{from{transform:scale(.94) translateY(12px)}to{transform:none}}
@keyframes fl2{from{transform:rotate(-12deg) translate(-30px,20px);opacity:0}to{transform:rotate(-5deg);opacity:1}}
@keyframes fl3{from{transform:rotate(12deg) translate(30px,20px);opacity:0}to{transform:rotate(5deg);opacity:1}}
.dots{position:absolute;left:clamp(28px,4.5vw,64px);bottom:22px;display:flex;gap:8px;z-index:3}
.dots button{width:26px;height:4px;border-radius:9px;border:0;padding:0;background:rgba(255,255,255,.45);overflow:hidden;position:relative}
.dots button span{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.dots button.on span{animation:prog 6s linear forwards}
.carousel.paused .dots button.on span{animation-play-state:paused}
@keyframes prog{to{transform:scaleX(1)}}
.arrows{position:absolute;right:18px;bottom:16px;display:flex;gap:8px;z-index:3}
.arrows button{width:40px;height:40px;border-radius:999px;border:0;background:rgba(255,255,255,.85);color:var(--carmin-dk);display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.arrows button:hover{transform:scale(1.08);background:#fff}
@media (max-width:760px){
  .carousel{height:auto;min-height:520px}
  .slide{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:26px 22px 60px;gap:10px;align-content:start}
  .slide h2{font-size:32px}
  .slide p{margin:10px 0 18px;font-size:14px}
  .collage{height:230px}
  .arrows{display:none}
}

/* ── Birthday ── */
.s-bday{background:radial-gradient(90% 120% at 90% 10%,#F7DADF 0%,#F3E4D6 45%,var(--beige) 100%);color:var(--ink)}
.s-bday h2{color:var(--carmin-dk)} .s-bday .kick{color:var(--carmin)}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.confetti i{position:absolute;border-radius:2px;opacity:.75;animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{translate:0 -6px;rotate:0deg}to{translate:0 8px;rotate:40deg}}
.slide .collage{z-index:2}
.bday{position:relative;overflow:hidden;border-radius:var(--r-lg);margin:12px 0 22px;padding:clamp(24px,4vw,44px);min-height:220px;display:flex;align-items:center;background:radial-gradient(90% 140% at 95% 0%,#F7DADF 0%,#F3E4D6 45%,var(--beige) 100%);border:1px solid var(--line)}
.bday-txt{position:relative;z-index:2;max-width:560px}
.bday .kick{font:500 11.5px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--carmin)}
.bday h1{font-size:clamp(30px,4vw,48px);color:var(--carmin-dk);margin-top:10px;line-height:1.05}
.bday h1 em{font-style:italic;color:var(--carmin)}
.bday p{margin:10px 0 0;color:var(--ink-2);font-size:14.5px;max-width:48ch}
.balloons{position:absolute;right:clamp(8px,4vw,56px);top:6px;height:calc(100% + 20px);width:auto;z-index:1}
.balloons g{animation:float 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
.balloons .b2{animation-delay:-1.6s}.balloons .b3{animation-delay:-3s}
@keyframes float{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-10px) rotate(2deg)}}
@media (max-width:640px){.balloons{opacity:.35;right:-30px}}
.ctile.special .ci{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--rosa)}

/* ── Home blocks ── */
.block{padding-block:clamp(36px,5vw,56px) 0}
.bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.bhead h2{font-size:clamp(26px,3vw,36px);color:var(--carmin-dk)}
.bhead p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--carmin);text-decoration:none;font-weight:500;font-size:13.5px;white-space:nowrap}
.link svg{transition:transform .3s var(--ease)}
.link:hover svg{transform:translateX(4px)}
.cats{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.cats{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:640px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ctile{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ctile .ci{width:100%;aspect-ratio:1/1.12;border-radius:999px 999px 18px 18px;overflow:hidden;background:var(--beige-lt);position:relative;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.ctile .ci img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.ctile:hover .ci{transform:translateY(-4px);box-shadow:0 18px 30px -20px rgba(90,30,36,.55)}
.ctile:hover .ci img{transform:scale(1.07)}
.ctile b{font:400 16px/1.2 var(--display);color:var(--ink)}
.ctile small{font-size:11.5px;color:var(--ink-3);margin-top:-8px}
.promos{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.promos .card{scroll-snap-align:start}
.band{margin-top:clamp(40px,6vw,64px);background:var(--beige);border-top:1px solid var(--line)}
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-block:32px}
.howto div{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.howto i{flex:none;font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:999px;background:var(--celeste-lt);color:#27465a;font-weight:600;font-size:13px}
.howto b{display:block;color:var(--ink);font-weight:500}
@media (max-width:860px){.howto{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.howto{grid-template-columns:1fr}}

/* ── Product cards ── */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px 16px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}.grid.best .card:nth-child(n+10){display:none}}
@media (min-width:761px) and (max-width:1100px){.grid.best .card:nth-child(n+9){display:none}}
.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0}
.ph{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:linear-gradient(165deg,#FBF4EA 0%,var(--beige-lt) 55%,#EEE2D3 100%);display:grid;place-items:center;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px;transition:transform .6s var(--ease)}
.card:hover .ph{transform:translateY(-4px);box-shadow:0 20px 34px -22px rgba(90,30,36,.55)}
.card:hover .ph>img{transform:scale(1.04)}
.ph .ph-fallback{position:absolute;inset:0;display:grid;place-items:center}
.ph .ph-fallback img{width:34%;height:auto;opacity:.5}
.badge{position:absolute;left:8px;top:8px;background:var(--carmin);color:#fff;font-size:10.5px;font-weight:500;border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge.soft{background:var(--paper);color:var(--carmin-dk)}
.ver{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(252,247,240,.94);color:var(--carmin-dk);border-radius:999px;padding:7px;font-size:12px;font-weight:500;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .3s var(--ease),transform .35s var(--ease)}
.card:hover .ver,.card:focus-visible .ver{opacity:1;transform:none}
@media (hover:none){.ver{display:none}}
.card .meta{padding:10px 2px 0}
.card .nm{font:400 16px/1.2 var(--display);color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .pr{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 7px;margin-top:4px;font-weight:500;font-size:14px;color:var(--carmin)}
.card .pr s{color:var(--ink-3);font-weight:400;font-size:12px}
.card .pr .from{font-size:11px;color:var(--ink-3);font-weight:400}
@media (max-width:760px){.card .nm{font-size:13.5px}.card .pr{font-size:12.5px}.card .pr s{font-size:11px}.badge{font-size:9.5px;padding:2px 7px;left:6px;top:6px}.ph>img{padding:5px}.card .meta{padding-top:7px}}

/* ── Category page ── */
.crumb{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3);padding-top:26px}
.crumb a{color:var(--ink-2);text-decoration:none}
.crumb a:hover{color:var(--carmin)}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin:10px 0 18px}
.phead h1{font-size:clamp(32px,4vw,46px);color:var(--carmin-dk)}
.phead p{margin:6px 0 0;color:var(--ink-2);font-size:14.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:22px}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.sub{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--ink-2);transition:all .2s}
.sub:hover{border-color:var(--carmin);color:var(--carmin)}
.sub[aria-pressed="true"]{background:var(--carmin-dk);border-color:var(--carmin-dk);color:#fff}
.select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px}
.count{font-size:12.5px;color:var(--ink-3)}

/* ── Product page ── */
.pd{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,56px);align-items:start;margin-top:16px}
@media (max-width:860px){.pd{grid-template-columns:1fr}}
.pd-media{position:sticky;top:140px;display:flex;flex-direction:column;align-items:center;gap:10px}
@media (max-width:860px){.pd-media{position:relative;top:0}}
.pd-img{position:relative;width:100%;max-width:440px;aspect-ratio:4/5;border-radius:24px;padding:18px;background:linear-gradient(160deg,#FBF4EA 0%,var(--beige) 60%,#EFDFC8 100%);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 24px 44px -28px rgba(90,30,36,.45),0 2px 8px -4px rgba(90,30,36,.12);border:1px solid var(--line);display:grid;place-items:center;cursor:zoom-in;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.pd-img:hover{transform:translateY(-3px);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 30px 50px -28px rgba(90,30,36,.55),0 2px 8px -4px rgba(90,30,36,.12)}
.pd-img::before{content:"";position:absolute;inset:9px;border:1px solid rgba(193,61,73,.18);border-radius:17px;pointer-events:none}
.pd-img>img{position:absolute;inset:18px;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:contain;border-radius:10px}
@media (max-width:860px){.pd-img>img{inset:14px;width:calc(100% - 28px);height:calc(100% - 28px)}}
@media (max-width:860px){.pd-img{max-width:340px;padding:14px}}
.zoomhint{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.pd-img .ph-fallback{display:grid;place-items:center}
.pd-img .ph-fallback img{width:30%;opacity:.5}
.lb{position:fixed;inset:0;z-index:80;background:rgba(40,22,24,.86);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));opacity:0;transition:opacity .3s var(--ease);cursor:zoom-out}
.lb.on{opacity:1}
.lb img{max-width:min(92vw,900px);max-height:86vh;width:auto;height:auto;object-fit:contain;border-radius:14px;background:var(--beige-lt);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);transform:scale(.96);transition:transform .35s var(--ease)}
.lb.on img{transform:none}
.lb.big{place-items:start center;overflow:auto;cursor:zoom-out}
.lb.big img{max-width:none;max-height:none;width:min(1600px,200vw);cursor:zoom-out}
.lb .lbx{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;background:var(--paper)}
.lb .lbcap{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:var(--beige);font-size:12.5px;opacity:.85;white-space:nowrap}
.pd-info{display:flex;flex-direction:column;gap:16px;min-width:0}
.pd-info h1{font-size:clamp(30px,3.6vw,42px);color:var(--carmin-dk);line-height:1.08}
.pd-code{font-size:11.5px;letter-spacing:.1em;color:var(--ink-3);margin-top:-8px}

function startCarousel(){
  const car=$('#car'); if(!car) return;
  const slides=[...car.querySelectorAll('.slide')], dots=[...car.querySelectorAll('.dots button')];
  let i=0;
  const go=n=>{ i=(n+slides.length)%slides.length; slides.forEach((s,k)=>{s.classList.toggle('on',k===i); s.setAttribute('aria-hidden',k!==i);}); dots.forEach((d,k)=>{d.classList.remove('on'); if(k===i){ void d.offsetWidth; d.classList.add('on'); }}); restart(); };
  const restart=()=>{ clearInterval(slideTimer); if(!car.classList.contains('paused')) slideTimer=setInterval(()=>go(i+1),6000); };
  car.querySelector('.dots').onclick=e=>{const b=e.target.closest('button'); if(b) go(+b.dataset.i);};
  car.querySelector('.arrows').onclick=e=>{const b=e.target.closest('button'); if(b) go(i+ +b.dataset.d);};
  car.addEventListener('mouseenter',()=>{car.classList.add('paused'); clearInterval(slideTimer);});
  car.addEventListener('mouseleave',()=>{car.classList.remove('paused'); restart();});
  let x0=null; car.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
  car.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) go(i+(dx<0?1:-1)); x0=null; });
  restart();
}

function route(){
  clearInterval(slideTimer);
  document.querySelectorAll('.lb').forEach(x=>x.remove()); document.body.style.overflow='';
  const h=location.hash.slice(1)||'inicio';
  let html, tab='inicio', after=null;
  if(h.startsWith('c-')){ const k=h.slice(2); tab=k; html=viewCategory(k); after=()=>fillCategory(k); }
  else if(h.startsWith('p-')){ const p=byId[h.slice(2)]; tab=p?p.grp:'inicio'; html=viewProduct(h.slice(2)); after=p?wireProduct:null; }
  else if(h==='terminos'){ tab=''; html=viewTerms(); }
  else { html=viewHome(); after=startCarousel; }
  if(!h.startsWith('p-') && !h.startsWith('c-') && h!=='terminos' && h!=='inicio'){ /* unknown */ }
  const v=$('#view'); v.classList.remove('enter'); v.innerHTML=html; void v.offsetWidth; v.classList.add('enter');
  renderTabs(tab);
  if(after) after();
  if($('#q').value && !h.startsWith('buscar')) $('#q').value='';
  window.scrollTo({top:0,behavior:'instant'});

}

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let io=null;
function setupReveal(){
  if(reduce || !('IntersectionObserver' in window)) return;
  io && io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.remove('pre'); io.unobserve(en.target);} }),{rootMargin:'0px 0px -8% 0px'});
  const vh=innerHeight;
  document.querySelectorAll('#view .block, #view .band, #view .ctile, #view .grid .card, #view .promos .card').forEach((el,i)=>{
    if(el.getBoundingClientRect().top > vh*0.92){ el.classList.add('reveal','pre'); el.style.transitionDelay = (el.classList.contains('card')||el.classList.contains('ctile')) ? ((i%5)*60)+'ms' : '0ms'; io.observe(el); }
  });
}
function stagger(el){ if(reduce) return; [...el.children].forEach((c,i)=>{ c.style.animation=`enter .45s var(--ease) ${Math.min(i,14)*35}ms both`; }); }
function fly(from){
  if(reduce) return;
  const a=from.getBoundingClientRect(), b=$('#openCart').getBoundingClientRect();
  const d=document.createElement('div'); d.className='flydot'; d.style.left=(a.left+a.width/2)+'px'; d.style.top=(a.top+a.height/2)+'px'; document.body.appendChild(d);
  requestAnimationFrame(()=>{ d.style.transform=`translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(.5)`; d.style.opacity='.3'; });
  setTimeout(()=>{ d.remove(); const c=$('#openCart'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); },720);
}

function lightbox(p){

function fmt(s){ // escape, then allow **bold**, product links [txt](#p-id) and line breaks
  let h=esc(s);
  h=h.replace(/\[([^\]]{1,80})\]\(#p-([a-z0-9-]{3,40})\)/g,(m,txt,id)=>byId[id]?`<a href="#p-${id}">${txt}</a>`:txt);
  h=h.replace(/\*\*([^*]{1,120})\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
  return h;
}
function say(text,who='bot'){ const d=document.createElement('div'); d.className='msg '+who; d.innerHTML= who==='bot'?fmt(text):esc(text); cm().appendChild(d); scrollChat(); return d; }
function chips(list){ const w=document.createElement('div'); w.className='chips'; list.forEach(([label,fn])=>{ const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=label; b.onclick=()=>{ w.remove(); say(label,'me'); fn(); }; w.appendChild(b); }); cm().appendChild(w); scrollChat(); }
function recs(list){ const w=document.createElement('div'); w.className='recs'; w.innerHTML=list.map(p=>`<a class="rec" href="#p-${p.id}"><img src="${imgSrc(p.id)}" alt=""><div><b>${esc(p.name)}</b><span>${p.variants?'desde ':''}${money(p.price)}</span></div><em>Ver →</em></a>`).join(''); cm().appendChild(w); scrollChat(); }
function typing(){ const d=say(''); d.innerHTML='<span class="typing"><i></i><i></i><i></i></span>'; return d; }
function later(fn,ms=650){ const d=typing(); setTimeout(()=>{ d.remove(); fn(); },reduce?50:ms); }
function mainMenu(){ chips([['Ayúdame a elegir un regalo',askWho],['¿Cómo compro?',()=>later(()=>{answer('comprar');more();})],['Envíos y horarios',()=>later(()=>{answer('envio');more();})],['Contacto',()=>later(()=>{answer('contacto');more();})]]); }
function more(){ chips([['Elegir un regalo',askWho],['Tengo otra pregunta',()=>later(()=>say('Claro, escríbeme tu pregunta aquí abajo 👇'))]]); }

  pago:'Puedes pagar por transferencia o depósito (BCP, Scotiabank o Yape) o en línea con IziPay o PagoEfectivo (+5%). Aceptamos todas las tarjetas. Tu pedido se agenda al confirmar el pago.',
  contacto:'Puedes escribirnos por WhatsApp al **988 869 994** o al correo **casaamara.pe@gmail.com**. ¡Te respondemos con gusto!',

  factura:'Sí, emitimos boleta y factura. Los precios ya incluyen IGV. Para pedidos de 6 unidades o más tenemos precios por mayor.',
};
function answer(k){ say(FAQ[k]); }
function askWho(){ guide={}; later(()=>{ say('¡Me encanta! Cuéntame, ¿para quién es el regalo?'); chips([['Para ella',()=>{guide.who='ella';askOcc();}],['Para él',()=>{guide.who='el';askOcc();}],['Para mi pareja',()=>{guide.who='pareja';askOcc();}],['Para mi mamá o papá',()=>{guide.who='padres';askOcc();}],['Para mi equipo o clientes',()=>{guide.who='empresa';guide.occ='corporativo';askBudget();}]]); }); }
function askOcc(){ later(()=>{ say('¿Y qué ocasión celebran?'); chips([['Cumpleaños',()=>{guide.occ='cumple';askBudget();}],['Aniversario o amor',()=>{guide.occ='amor';askBudget();}],['Agradecimiento o detalle',()=>{guide.occ='detalle';askBudget();}],['Graduación',()=>{guide.occ='graduacion';askBudget();}],['Condolencias',()=>{guide.occ='condolencias';askBudget();}],['Sin motivo, solo porque sí',()=>{guide.occ='detalle';askBudget();}]]); }); }
function askBudget(){ later(()=>{ say('Perfecto. ¿Cuál es tu presupuesto aproximado?'); chips([['Hasta S/ 60',()=>{guide.b=[0,60];recommend();}],['S/ 60 a S/ 100',()=>{guide.b=[60,100];recommend();}],['S/ 100 a S/ 150',()=>{guide.b=[100,150];recommend();}],['Más de S/ 150',()=>{guide.b=[150,9999];recommend();}]]); }); }
function pool(){
  const {who,occ}=guide; let s=PRODUCTS.filter(p=>p.grp!=='extras');
  const W={ella:['flores','ella','desayunos','brindis','ocasiones'],el:['el','brindis','desayunos'],pareja:['flores','ocasiones','brindis','ella','el'],padres:['flores','desayunos','ella','el','brindis'],empresa:['corporativo','el','ella']}[who]||[];
  const score=p=>{ let v=0;
    if(W.includes(p.grp)) v+=3-W.indexOf(p.grp)*0.3;
    if(who==='el' && p.grp==='brindis' && p.sub==='Para él') v+=2;
    if(who==='ella' && p.grp==='brindis' && p.sub==='Para ella') v+=1;
    if(occ==='cumple' && p.cumple) v+=5;
    if(occ==='amor' && (p.sub==='Aniversario y amor' || (p.grp==='flores' && /ros/i.test(p.name+p.items.join(' '))))) v+=4;
    if(occ==='graduacion' && p.sub==='Graduación') v+=6;
    if(occ==='condolencias' && p.sub==='Condolencias') v+=9;
    if(occ==='corporativo' && p.grp==='corporativo') v+=6;
    if(occ==='detalle' && ['ella','el','flores','desayunos'].includes(p.grp)) v+=1.5;
    if(p.feat) v+=1.2-(p.feat*0.1); if(BEST.includes(p.id)) v+=1; return v; };
  return s.map(p=>[score(p),p]).filter(x=>x[0]>2).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
}
function recommend(){
  later(()=>{
    const all=pool(), [lo,hi]=guide.b; let r=all.filter(p=>p.price>=lo&&p.price<=hi).slice(0,4); let note='';
    if(r.length<2){ r=all.slice().sort((a,b)=>Math.abs(a.price-(lo+hi)/2)-Math.abs(b.price-(lo+hi)/2)).slice(0,4); note=' No encontré muchas opciones exactas en ese rango, así que te muestro las más cercanas.'; }
    say('¡Tengo algunas ideas para ti!'+note+' Toca cualquiera para ver sus detalles:');
    recs(r);
    setTimeout(()=>{ say('En cada producto puedes elegir la fecha y escribir tu dedicatoria. ¿Te ayudo con algo más?'); chips([['Ver otras opciones',askWho],['¿Cómo compro?',()=>later(()=>{answer('comprar');more();})],['Hablar por WhatsApp',()=>later(()=>{say('Escríbenos aquí: [WhatsApp 988 869 994](https://wa.me/51988869994) 💛'); linkify();})]]); },reduce?0:500);
  },900);
}
function linkify(){ const last=cm().lastElementChild; if(last) last.innerHTML=last.innerHTML.replace(/\[([^\]]+)\]\((https:\/\/wa\.me\/[0-9]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>'); }
function localReply(q){
  const n=norm(q);
  const has=(...w)=>w.some(x=>n.includes(x));
  if(has('hola','buenas','buenos')&&n.length<25){ say('¡Hola! 💛 Cuéntame qué buscas o déjame ayudarte a elegir.'); mainMenu(); return; }
  if(has('como compr','como pido','pedido','comprar','hacer un pedido')){ answer('comprar'); more(); return; }
  if(has('envio','delivery','entrega','provincia','distrito','shalom','llega','horario','turno','hora')){ answer('envio'); more(); return; }
  if(has('pago','pagar','yape','plin','tarjeta','transfer','izipay','deposito')){ answer('pago'); more(); return; }
  if(has('devol','cambio','reembolso')){ answer('cambios'); more(); return; }
  if(has('factura','boleta','igv','por mayor','mayoreo')){ answer('factura'); more(); return; }
  if(has('contact','whatsapp','wsp','correo','telefono','numero','llamar')){ answer('contacto'); more(); return; }
  if(has('recomiend','ayuda','regalo','elegir','sugier','que le regalo','ideas')){ askWho(); return; }
  // product search with optional budget
  const m=n.match(/(\d{2,4})/); const max=m?+m[1]:null;
  const bday=has('cumple','birthday');
  const words=n.split(/[^a-z0-9ñ]+/).filter(w=>w.length>3 && !['para','quiero','busco','algo','menos','soles','hasta','precio','tienen','tienes','cuanto','cuesta','regalo'].includes(w));
  let found=PRODUCTS.filter(p=>{ const hay=norm(p.name+' '+p.sub+' '+(GL[p.grp]||'')+' '+p.items.join(' '))+(p.cumple?' cumpleanos cumple':''); return (bday&&p.cumple) || (words.length && words.some(w=>hay.includes(w.replace(/s$/,'')))); });
  if(max) found=found.filter(p=>p.price<=max);
  if(found.length){ say(`Encontré ${found.length>4?'estas opciones':'esto'} en nuestro catálogo${max?` hasta S/ ${max}`:''}:`); recs(found.slice(0,4)); if(found.length>4) say('Hay más opciones en la tienda. ¿Quieres que te ayude a afinar la búsqueda?'); more(); return; }
  say('Mmm, esa no la sé con seguridad 🙈 Para ayudarte mejor, escríbenos al correo **casaamara.pe@gmail.com** o por [WhatsApp 988 869 994](https://wa.me/51988869994) y te respondemos pronto.'); linkify(); more();
}
async function aiReply(q){
  const d=typing();
  try{
    const r=await fetch(CHAT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chatHist.slice(-12)})});
    if(!r.ok) throw new Error('http '+r.status);
    const j=await r.json(); d.remove();
    const txt=(j.reply||'').trim(); if(!txt) throw new Error('empty');
    chatHist.push({role:'model',text:txt});
    const b=say(txt); b.innerHTML=b.innerHTML.replace(/\[([^\]]+)\]\((https:\/\/wa\.me\/[0-9]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    const ids=[...new Set([...txt.matchAll(/#p-([a-z0-9-]+)/g)].map(m=>m[1]).filter(id=>byId[id]))].slice(0,4);
    if(ids.length) recs(ids.map(id=>byId[id]));
  }catch(e){ d.remove(); useAI=false; localReply(q); }
}
function openChat(){ const c=$('#chat'); c.classList.add('on'); c.setAttribute('aria-hidden','false'); $('#chatFab').setAttribute('aria-expanded','true'); $('#chatFab').classList.remove('hint');
  if(!chatStarted){ chatStarted=true; later(()=>{ say(WELCOME); mainMenu(); },500); }
  setTimeout(()=>$('#cinput').focus({preventScroll:true}),350); }
function closeChat(){ const c=$('#chat'); c.classList.remove('on'); c.setAttribute('aria-hidden','true'); $('#chatFab').setAttribute('aria-expanded','false'); }
$('#chatFab').onclick=()=>$('#chat').classList.contains('on')?closeChat():openChat();
$('#chatClose').onclick=closeChat;
$('#cmsgs').addEventListener('click',e=>{ const a=e.target.closest('a[href^="#p-"]'); if(a && innerWidth<520) closeChat(); });
$('#cform').onsubmit=e=>{ e.preventDefault(); const i=$('#cinput'), q=i.value.trim(); if(!q) return; i.value='';
  document.querySelectorAll('#cmsgs .chips').forEach(x=>x.remove());
  say(q,'me'); chatHist.push({role:'user',text:q.slice(0,400)});
  if(useAI) aiReply(q); else later(()=>localReply(q),600); };
setTimeout(()=>{ if(!chatStarted) $('#chatFab').classList.add('hint'); setTimeout(()=>$('#chatFab').classList.remove('hint'),5000); },4000);

renderCart(); firstRoute=false; route();
</script>
